name: Analyze Sources

on:
  workflow_dispatch:
  schedule:
    - cron: 0 16 1 * *

env:
  TZ: Asia/Shanghai

jobs:
  Analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: '3.14'

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python -m pip install --upgrade pip
          pip install -U tld IPy dnspython httpx loguru

      - name: Run analysis
        run: python analyze_sources.py 2>&1 | tee source_report.txt

      - name: Upload report
        uses: actions/upload-artifact@main
        with:
          name: source-report
          path: source_report.txt