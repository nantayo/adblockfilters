name: Generate Blacklist

on: 
  workflow_dispatch:
  schedule:
    - cron: 0 17 * * *

env:
  TZ: Asia/Shanghai
  SMARTDNS_URL: https://github.com/pymumu/smartdns/releases/download/Release48.4/smartdns-x86_64
  SMARTDNS_PATH: /tmp/smartdns
  DB_URL: https://github.com/nantayo/adblockfilters/releases/download/domain/domain.db

jobs:
  Generate_Blacklist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: '3.14'

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timedatectl set-timezone "$TZ"
          python -m pip install --upgrade pip
          pip install -U tld IPy dnspython httpx loguru
      
      - name: Setup SmartDNS
        run: |
          mkdir -p $SMARTDNS_PATH
          wget $SMARTDNS_URL -O $SMARTDNS_PATH/smartdns
          chmod +x $SMARTDNS_PATH/smartdns
          cp smartdns.conf $SMARTDNS_PATH/smartdns.conf
          nohup $SMARTDNS_PATH/smartdns -f -x -c $SMARTDNS_PATH/smartdns.conf > /dev/null 2>&1 &

      - name: Download DB
        continue-on-error: true
        run: |
          wget $DB_URL -O domain.db

      - name: Generate Blacklist
        id: update
        run: |
          python blacklist.py
          rm -rf __pycache__
          echo "message=$(date)" >> $GITHUB_OUTPUT

      - name: Upload DB
        uses: svenstaro/upload-release-action@master
        with:
          repo_token: ${{secrets.GITHUB_TOKEN}}
          file_glob: true
          file: domain.db
          tag: domain
          body: |
          overwrite: true

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: ${{ steps.update.outputs.message }}
          
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 5